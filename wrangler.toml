# ─────────────────────────────────────────────────────────────
# EasyInstall Ultra — Cloudflare Worker Config
# Account: dcb6aa20e37973db85d2401662eb431f
#
# STEP 1: Set your domain — replace YOUR_DOMAIN.COM below (2 places)
# STEP 2: Set secret in Cloudflare Dashboard:
#         Worker → Settings → Variables → Add variable
#         Name: PURGE_WEBHOOK_SECRET  |  Value: any-random-string
# STEP 3: Push to GitHub → Cloudflare auto-deploys
# ─────────────────────────────────────────────────────────────

name               = "easyinstall-ultra-worker"
main               = "worker/worker.js"
compatibility_date = "2024-09-23"
account_id         = "dcb6aa20e37973db85d2401662eb431f"

# ── Routes ────────────────────────────────────────────────────
# !! REQUIRED: Replace YOUR_DOMAIN.COM with your real domain !!
[[routes]]
pattern   = "YOUR_DOMAIN.COM/*"
zone_name = "ez-ins.site"

# ── KV Namespace (wp-login rate limiting) ────────────────────
# Optional — skip for first deploy, add later if needed.
# To enable:
#   1. Run:  wrangler kv namespace create "LOGIN_KV"
#   2. Uncomment the 3 lines below and paste the id
#
# [[kv_namespaces]]
# binding = "LOGIN_KV"
# id      = "PASTE_KV_ID_HERE"

# ── Build ─────────────────────────────────────────────────────
# Tells Cloudflare: no static site, this is a pure Worker
[build]
command = "echo 'Worker ready'"

# ── Environment Variables ─────────────────────────────────────
[vars]
ENVIRONMENT = "production"
VPS_REPO    = "https://github.com/sugan0927/easy-install-Ultra"

# ── Observability ─────────────────────────────────────────────
[observability]
enabled = true
