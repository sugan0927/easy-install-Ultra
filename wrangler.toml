## Deploy के बाद — Cloudflare Dashboard पर Route add करो:
```
Dashboard → Workers & Pages → easy-ultra
→ Settings → Triggers → Add Route

Route:       ez-ins.site/*
Zone:        ez-ins.site

फिर दोबारा:
Route:       www.ez-ins.site/*
